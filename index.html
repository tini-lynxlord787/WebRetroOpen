<!DOCTYPE html>
<html>
<head>
  <title>Open Game</title>
</head>
<body>

<button onclick="openGame()">Open</button>

<script>
function openGame() {
  const win = window.open("about:blank", "_blank");

  if (!win) {
    alert("Popup blocked.");
    return;
  }

  win.document.open();
  win.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        html, body {
          margin: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }

        iframe {
          width: 100%;
          height: 100%;
          border: none;
        }
      </style>
    </head>
    <body>
      <iframe src="https://example.com"></iframe>
    </body>
    </html>
  `);
  win.document.close();
}
</script>

</body>
</html>
